<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luật chơi</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="../CSS/rule.css">

</head>


<body>

    <!-- =================================
         BẢNG LUẬT CHƠI
    ================================= -->

    <div class="rule-box">

        <!-- TIÊU ĐỀ -->
        <div class="rule-header">

            <h2>Một số luật của trò chơi</h2>

        </div>


        <!-- NỘI DUNG -->
        <div class="rule-content">

            <ol>

                <li>
                    Bạn sẽ có <span>30 giây</span> cho mỗi câu hỏi.
                </li>

                <li>
                    Khi đã chọn đáp án, bạn không thể thay đổi.
                </li>

                <li>
                    Bạn không thể chọn đáp án khi hết thời gian.
                </li>

                <li>
                    Bạn không thể thoát khỏi trò chơi khi đang chơi.
                </li>

            </ol>

        </div>


        <!-- =================================
             HAI NÚT
        ================================= -->

        <div class="rule-footer">

            <!-- Thoát game → về start.html -->
            <a href="../index.html" class="exit-btn">
                Thoát game
            </a>

            <!-- Tiếp tục → sang quiz.html -->
            <a href="./quiz.html" class="continue-btn">
                Tiếp tục
            </a>

        </div>

    </div>

</body>

</html>
